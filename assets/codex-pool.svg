    <circle cx="146" cy="174" r="40"/>
    <circle cx="146" cy="256" r="40"/>
    <circle cx="146" cy="338" r="40"/>
  </g>
  <circle cx="146" cy="174" r="24" fill="#61E4C8"/>
  <circle cx="146" cy="256" r="24" fill="#A6C5FF"/>
  <circle cx="146" cy="338" r="24" fill="#AC98F7"/>
  <path d="M228 174 L310 256 L228 338" fill="none" stroke="#B5E1FC" stroke-opacity=".10" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 174 L310 256 L228 338" fill="none" stroke="url(#prompt)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M331 347 H388" fill="none" stroke="#62E5D1" stroke-width="28" stroke-linecap="round"/>
