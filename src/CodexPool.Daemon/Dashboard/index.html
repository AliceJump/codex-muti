<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex Pool</title><link rel="stylesheet" href="/dashboard.css"><script defer src="/dashboard.js"></script></head>
<body><main><header><div><div class="eyebrow">MODEL ACCESS · LOCAL</div><h1>Codex Pool<span class="dot"></span></h1><p>你的账户与额度，一处掌握。</p></div><div class="connection"><span id="connection">连接中</span><small>127.0.0.1:3210</small></div></header>
<div id="notice" role="status" class="notice" hidden></div><section id="locked" hidden class="panel"><h2>打开你的本地控制台</h2><p>在终端运行 Codex Pool 的 <code>dashboard</code> 命令，建立安全的浏览器会话。</p></section>
<div id="workspace" hidden><section class="overview"><div><small>当前账户</small><strong id="active">—</strong></div><div><small>自动切换</small><strong id="automatic">—</strong></div><div><small>正在处理</small><strong id="inflight">0</strong></div><div><small>账户总数</small><strong id="total">0</strong></div></section>
<div class="section-title"><h2>账户池</h2><button id="refresh">更新额度</button></div><section id="accounts" class="accounts" aria-label="账户选择"></section>
<div class="lower"><section class="panel"><h2>切换设置</h2><p class="muted">切换只影响下一次模型请求。当前请求继续使用原账户。</p><form id="settings"><label class="toggle"><input type="checkbox" name="autoSwitch"> 自动切换</label><div class="fields"><label>5h 使用阈值<input name="fiveHourThreshold" type="number" min="1" max="100" step="0.1" required></label><label>Weekly 使用阈值<input name="weeklyThreshold" type="number" min="1" max="100" step="0.1" required></label></div><p id="gate" class="muted"></p><button class="primary" type="submit">保存设置</button></form></section>
<section class="panel"><h2>添加账户</h2><p class="muted">授权在系统浏览器完成，凭据保存在本机。</p><form id="login"><label>账户名称<input name="name" maxlength="80" placeholder="例如：Personal" required></label><button class="primary" type="submit">使用官方 Codex 登录</button></form><div id="logins" class="muted"></div></section></div>
<section class="panel history"><h2>最近切换</h2><div id="switches"></div></section><section class="panel history"><h2>最近请求</h2><div class="table-scroll"><table><thead><tr><th>时间</th><th>账户</th><th>模型</th><th>耗时</th><th>状态</th><th>尝试</th></tr></thead><tbody id="requests"></tbody></table></div></section>
<footer>Codex 负责会话、工具与任务流程。Codex Pool 负责模型访问。</footer></div></main></body></html>
